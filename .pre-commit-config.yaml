# Python hooks run through uv, so they use the exact versions in backend/uv.lock
# (and mypy sees django-stubs), instead of separate copies managed by pre-commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: import-linter
        name: import-linter
        # --no-cache: a stale cache once reported an import that had already been removed.
        entry: uv run --directory backend lint-imports --no-cache
        language: system
        files: ^backend/
        pass_filenames: false
