[project]
name = "taskmanager"
version = "0.1.0"
description = "Task Manager API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.30",
    "celery[redis]>=5.7",
    "redis>=8.1",
    "psycopg[binary]>=3.3",
    "gunicorn>=27",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-django>=4.14",
    "pytest-cov>=7.1",
    "factory-boy>=3.3",
    "ruff>=0.17",
    "mypy>=2.4",
    "django-stubs>=6.1",
    "djangorestframework-stubs>=3.18",
    "import-linter>=2.16",
    "pre-commit>=4.7",
]

[tool.uv]
# This is an application, not a library: install dependencies only, never build a wheel.
package = false

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "RUF",
    "S",    # security
    "DJ",   # Django
    "DTZ",  # naive datetimes / date.today(): time must come from the Clock port
    "PT",   # pytest style
    "TID",  # banned imports
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake test passwords
"config/settings/*" = ["F403", "F405"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# factory_boy declarations (Sequence, Password) have no type hints.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery has no type hints, so its @app.task decorator would make every job "untyped".
# The job functions themselves are still fully annotated.
module = ["apps.*.interfaces.jobs"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- import-linter: the architecture rules from HANDOFF.md section 3 --------

[tool.importlinter]
root_packages = ["apps", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each feature is layered: interfaces > infrastructure > application > domain"
type = "layers"
containers = ["apps.tasks", "apps.users", "apps.core"]
layers = ["interfaces", "infrastructure", "application", "(domain)"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain and application are framework-free"
type = "forbidden"
source_modules = [
    "apps.tasks.domain", "apps.tasks.application",
    "apps.users.domain", "apps.users.application",
    "apps.core.domain", "apps.core.application",
]
forbidden_modules = [
    "django", "rest_framework", "rest_framework_simplejwt", "drf_spectacular",
    "celery", "kombu", "redis", "psycopg",
]

[[tool.importlinter.contracts]]
name = "Only the composition root (interfaces.container) touches infrastructure"
type = "forbidden"
source_modules = ["apps.tasks.interfaces", "apps.users.interfaces", "apps.core.interfaces"]
forbidden_modules = ["apps.tasks.infrastructure", "apps.users.infrastructure", "apps.core.infrastructure"]
ignore_imports = ["apps.*.interfaces.container -> apps.*.infrastructure.**"]

[[tool.importlinter.contracts]]
name = "Tasks reaches users only through users.application"
type = "forbidden"
source_modules = ["apps.tasks"]
forbidden_modules = ["apps.users.domain", "apps.users.infrastructure", "apps.users.interfaces"]

[[tool.importlinter.contracts]]
name = "Users does not depend on tasks"
type = "forbidden"
source_modules = ["apps.users"]
forbidden_modules = ["apps.tasks"]

[[tool.importlinter.contracts]]
name = "Demo data is a leaf: no feature imports it"
type = "forbidden"
source_modules = ["apps.tasks", "apps.users", "apps.core", "config"]
forbidden_modules = ["apps.demo"]

# --- pytest / coverage ------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "config"]
addopts = "--strict-markers --cov --cov-report=term-missing:skip-covered --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/wsgi.py", "config/asgi.py"]
