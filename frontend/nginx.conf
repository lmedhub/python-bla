# Serves the built frontend and proxies /api to Django: the browser sees one origin, so there
# is no CORS, and the refresh cookie (path /api/v1/auth) works as it does in development.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Django's rate limits read the client's IP from here (NUM_PROXIES=1, ADR 0005).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Built files have a content hash in their names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every app route (/tasks/42/edit) loads index.html, which is never cached, so a new
    # deploy shows up on the next page load. The security headers cover the app's pages;
    # Swagger UI under /api/ loads its scripts from a CDN and is left to Django.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
