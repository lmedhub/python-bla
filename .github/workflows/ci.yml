name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Credentials match the defaults in config/settings/test.py.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      # Third-party actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint, types and architecture contracts
        run: make lint-backend

      - name: Tests with coverage gate
        run: make test-backend

      # openapi.yaml is the contract the frontend types are generated from. If a serializer
      # changes without regenerating it, this fails.
      - name: OpenAPI schema is up to date
        run: |
          make openapi
          git diff --exit-code openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # One image runs the API, the Celery worker and beat. Building it here catches a broken
      # Dockerfile or lockfile before anyone runs docker compose.
      - name: Build the backend image
        run: docker build --tag taskmanager-backend backend

      - name: The image runs as a non-root user
        run: test "$(docker run --rm taskmanager-backend id -u)" != "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The TypeScript types are generated from openapi.yaml. If the contract changed and the
      # types were not regenerated, this fails; then tsc below checks every use of them.
      - name: Generated API types match openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
