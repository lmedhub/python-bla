name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Credentials match the defaults in config/settings/test.py.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      # Third-party actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint, types and architecture contracts
        run: make lint-backend

      - name: Tests with coverage gate
        run: make test-backend

      # openapi.yaml is the contract the frontend types are generated from. If a serializer
      # changes without regenerating it, this fails.
      - name: OpenAPI schema is up to date
        run: |
          make openapi
          git diff --exit-code openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # HANDOFF's definition of done: a clean checkout plus .env.example gives a working app
      # with demo data. Builds both images, then waits for every healthcheck.
      - name: Start the whole stack from a clean checkout
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 300

      - name: Both images run as non-root users
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"

      - name: Smoke test through nginx
        run: |
          export DEMO_PASSWORD="$(grep '^DEMO_PASSWORD=' .env | cut -d= -f2)"
          python3 scripts/smoke_test.py http://localhost:8080

      # Browser tests against the same stack, in Chromium (ADR 0016).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests through nginx
        working-directory: frontend
        run: |
          export DEMO_PASSWORD="$(grep '^DEMO_PASSWORD=' ../.env | cut -d= -f2)"
          npm run e2e

      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The TypeScript types are generated from openapi.yaml. If the contract changed and the
      # types were not regenerated, this fails; then tsc below checks every use of them.
      - name: Generated API types match openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
